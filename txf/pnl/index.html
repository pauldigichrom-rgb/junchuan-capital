<style>

*{box-sizing:border-box}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.tiles div{padding:13px 15px 15px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.tiles dt{font-size:.72rem;color:var(--muted);margin-bottom:5px}
.tiles dd{margin:0;font-family:var(--mono);font-size:1.18rem;font-weight:600;color:var(--ink)}

.up{color:var(--rise)} .dn{color:var(--fall)}

table{border-collapse:collapse;width:100%;min-width:600px;font-size:.85rem}
th,td{padding:7px 13px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}

thead th{position:sticky;top:0;background:var(--raise);font-family:var(--mono);font-size:.69rem;

tr.hl td{background:var(--accent-soft)}
.note{border:1px solid var(--rule);background:var(--warn-bg);padding:13px 15px;margin-top:20px;

<header><div class="wrap">
  <h1>台指期損益回測台</h1>
  <div class="asof" id="asof">—</div>
</div></header>

<section><div class="wrap">
  <h2>設定</h2>
  <div class="panel">
    <label><span>起始日</span><input id="d0" type="date"></label>
    <label><span>結束日</span><input id="d1" type="date"></label>
    <label><span>本金（元）</span><input id="eq" type="number" step="100000" value="1000000"></label>
    <label><span>契約</span>
      <select id="ct"><option value="10">微台（10 元／點）</option>
        <option value="50">小台（50 元／點）</option>
        <option value="200">大台（200 元／點）</option></select></label>
    <label><span>均線上　槓桿</span><input id="hi" type="number" step="0.5" min="0" max="12" value="4"></label>
    <label><span>均線下　槓桿</span><input id="lo" type="number" step="0.5" min="0" max="12" value="2"></label>
    <label><span>用哪條均線</span>
      <select id="ma"><option value="20">月線（20 日）</option>
        <option value="60">季線（60 日）</option>
        <option value="120">半年線（120 日）</option>
        <option value="240">年線（240 日）</option></select></label>
    <label><span>轉倉日校槓桿</span>
      <select id="rb"><option value="1">開（穿線＋每月轉倉）</option>
        <option value="0">關（只在穿線時調）</option></select></label>
  </div>
  <dl class="tiles" id="tiles" style="margin-top:20px"></dl>
  <figure>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>帳戶權益（元）</span>
      <span><i style="background:var(--muted)"></i>本金</span>
      <span><i style="background:var(--rise)"></i>最大回撤區間</span>
    </div>
    <div class="chart"><svg id="chart" viewBox="0 0 900 330" role="img" aria-label="權益曲線"></svg></div>
    <figcaption id="cap"></figcaption>
  </figure>
</div></section>

<section><div class="wrap">
  <h2>逐月損益</h2>
  <div class="scroll"><table>
    <thead><tr><th>月份</th><th>指數</th><th>當月漲跌</th><th>月初權益</th><th>月末權益</th><th>當月損益</th><th>當月報酬</th><th>累計損益</th></tr></thead>
    <tbody id="months"></tbody>
  </table></div>
</div></section>

<section><div class="wrap">
  <h2>每一次調整</h2>
  <div class="scroll"><table>
    <thead><tr><th>日期</th><th>原因</th><th>指數</th><th>前</th><th>後</th><th>成本</th><th>當下權益</th><th>累計損益</th></tr></thead>
    <tbody id="adjs"></tbody>
  </table></div>
  <div class="note" id="caveat"></div>
</div></section>

const REF=48476, IM_R=35050/(10*REF), MM_R=26900/(10*REF);
const CASHY=Math.pow(1.01,1/244)-1, SPREAD=2, TAX=0.00002;
const N=P.d.length, $=id=>document.getElementById(id);
const money=v=>(v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('en-US');

const MAC={};
function ma(k){
  if(MAC[k]) return MAC[k];
  const out=new Array(N); let s=0;
  for(let i=0;i<N;i++){ s+=P.ix[i]; if(i>=k) s-=P.ix[i-k]; out[i]=s/Math.min(i+1,k); }
  return MAC[k]=out;
}
// 轉倉日：結算日（每月第三個星期三）前 3 個交易日
let ROLL=null;
function rolls(){
  if(ROLL) return ROLL;
  const set=new Set(), ds=P.d.map(x=>new Date(Math.floor(x/10000),Math.floor(x/100)%100-1,x%100));
  const y0=Math.floor(P.d[0]/10000), y1=Math.floor(P.d[N-1]/10000);
  for(let y=y0;y<=y1;y++) for(let m=0;m<12;m++){
    let c=0,day=null;
    for(let d=1;d<=31;d++){ const t=new Date(y,m,d); if(t.getMonth()!==m) break;
      if(t.getDay()===3){ c++; if(c===3){ day=t; break; } } }
    if(!day) continue;
    let k=-1; for(let i=0;i<N;i++) if(ds[i]<=day) k=i; else break;
    if(k-3>=0) set.add(P.d[k-3]);
  }
  return ROLL=set;
}

function run(a,b,hi,lo,k,pv,eq0,rebal){
  const M=ma(k), fee=CT[pv].fee, R=rolls();
  let above=P.ix[a]>=M[a];
  let lots=Math.max(Math.floor((above?hi:lo)*eq0/(pv*P.ix[a])),0);
  let eq=eq0, pend=null, peak=eq0, mdd=0, mddAmt=0, cost=0;
  const curve=[{d:P.d[a],eq:eq0,lots:lots}], adjs=[];
  adjs.push({d:P.d[a],why:'建倉',ix:P.ix[a],from:0,to:lots,c:0,eq:eq0});
  let ddFrom=P.d[a], ddTo=P.d[a], pkAt=P.d[a], pkIdx=0;
  for(let i=a+1;i<=b;i++){
    eq += lots*pv*(P.ao[i]-P.ac[i-1]);
    if(pend!==null){
      const df=Math.abs(pend.n-lots);
      if(df){ const c=df*(fee+SPREAD*pv)+df*pv*P.ix[i]*TAX; eq-=c; cost+=c; }
      adjs.push({d:P.d[i],why:pend.why||'調整',ix:P.ix[i],from:lots,to:pend.n,
                 c:df?(df*(fee+SPREAD*pv)+df*pv*P.ix[i]*TAX):0,eq:eq});
      lots=pend.n; pend=null;
    }
    eq += lots*pv*(P.ac[i]-P.ao[i]);
    eq += Math.max(eq-lots*pv*P.ix[i]*IM_R,0)*CASHY;
    if(lots>0 && eq<=lots*pv*P.ix[i]*MM_R){
      curve.push({d:P.d[i],eq:0,lots:0});
      return {dead:P.d[i],curve,adjs,cost,mdd:-100,mddAmt:-eq0,ddFrom,ddTo,eqEnd:0};
    }
    const na=P.ix[i]>=M[i], tgt=na?hi:lo;
    let want=null, why=null;
    if(na!==above){ above=na; want=Math.max(Math.floor(tgt*eq/(pv*P.ix[i])),0); why=na?'站上'+(k===20?'月線':k===60?'季線':k===120?'半年線':'年線'):'跌破'+(k===20?'月線':k===60?'季線':k===120?'半年線':'年線'); }
    else if(rebal && R.has(P.d[i])){ const w=Math.max(Math.floor(tgt*eq/(pv*P.ix[i])),0); if(w!==lots){ want=w; why='轉倉校槓桿'; } }
    if(want!==null) pend={n:want,why:why};
    if(eq>peak){ peak=eq; pkAt=P.d[i]; pkIdx=curve.length; }
    const dd=eq/peak-1;
    if(dd<mdd){ mdd=dd; mddAmt=eq-peak; ddFrom=pkAt; ddTo=P.d[i]; }
    curve.push({d:P.d[i],eq:eq,lots:lots});
  }
  return {dead:null,curve,adjs,cost,mdd:mdd*100,mddAmt,ddFrom,ddTo,eqEnd:eq};
}

function draw(r,eq0){
  const s=$('chart'), NS='http://www.w3.org/2000/svg';
  while(s.firstChild) s.removeChild(s.firstChild);
  const cs=getComputedStyle(document.documentElement), C=n=>cs.getPropertyValue(n).trim();
  const W=900,H=330,L=78,R=14,T=16,B=32, iw=W-L-R, ih=H-T-B;
  const c=r.curve, n=c.length;
  const vals=c.map(x=>x.eq).filter(x=>x>0).concat([eq0]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const log = hi/Math.max(lo,1) > 20;
  const f = v => log ? Math.log(Math.max(v,1)) : v;
  const ylo=f(log?Math.max(lo*0.9,1):lo*0.95), yhi=f(hi*1.06);
  const X=i=>L+(i/(n-1))*iw, Y=v=>T+ih-(f(Math.max(v,log?1:0))-ylo)/(yhi-ylo)*ih;
  const mk=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);s.appendChild(e);return e;};
  // 格線
  const ticks=[]; const span=hi-lo;
  for(let g=0;g<=5;g++){ const v = log ? Math.exp(ylo+(yhi-ylo)*g/5) : lo*0.95+span*1.1*g/5; ticks.push(v); }
  ticks.forEach(v=>{
    const y=Y(v); if(y<T-2||y>T+ih+2) return;
    mk('line',{x1:L,y1:y,x2:L+iw,y2:y,stroke:C('--hair'),'stroke-width':1});
    const t=mk('text',{x:L-8,y:y+4,fill:C('--faint'),'font-size':11,'text-anchor':'end','font-family':'IBM Plex Mono, monospace'});
    t.textContent=(v/10000).toFixed(0)+'萬';
  });
  // 本金線
  const y0=Y(eq0);
  if(y0>T&&y0<T+ih){ mk('line',{x1:L,y1:y0,x2:L+iw,y2:y0,stroke:C('--muted'),'stroke-width':1.4,'stroke-dasharray':'5 4'}); }
  // 回撤區間
  const i0=c.findIndex(x=>x.d===r.ddFrom), i1=c.findIndex(x=>x.d===r.ddTo);
  if(i0>=0&&i1>i0&&r.mdd<-2) mk('rect',{x:X(i0),y:T,width:Math.max(X(i1)-X(i0),1),height:ih,fill:C('--rise'),opacity:.10});
  // 年份刻度
  let ly=null; const tk=[];
  c.forEach((p,i)=>{const y=String(p.d).slice(0,4); if(y!==ly){ly=y;tk.push([i,y]);}});
  const every=Math.ceil(tk.length/9);
  tk.forEach(([i,y],j)=>{ if(j%every) return;
    mk('line',{x1:X(i),y1:T+ih,x2:X(i),y2:T+ih+5,stroke:C('--rule'),'stroke-width':1});
    const t=mk('text',{x:X(i),y:T+ih+19,fill:C('--faint'),'font-size':11,'text-anchor':'middle','font-family':'IBM Plex Mono, monospace'});
    t.textContent=y; });
  mk('polyline',{points:c.map((p,i)=>p.eq>0?X(i)+','+Y(p.eq):null).filter(Boolean).join(' '),
    fill:'none',stroke:C('--accent'),'stroke-width':2.2,'stroke-linejoin':'round'});
  const last=c[c.length-1];
  if(last.eq>0){ mk('circle',{cx:X(n-1),cy:Y(last.eq),r:4,fill:C('--accent')});
    const t=mk('text',{x:X(n-1)-6,y:Y(last.eq)-10,fill:C('--accent'),'font-size':12,'text-anchor':'end','font-weight':700,'font-family':'IBM Plex Mono, monospace'});
    t.textContent=money(last.eq); }
}

  const c=r.curve; let cur=null, rows=[];
  c.forEach((p,i)=>{
    const m=String(p.d).slice(0,6);
    if(!cur||cur.m!==m){ if(cur) rows.push(cur); cur={m:m,i0:i,i1:i}; }
    else cur.i1=i;
  });
  if(cur) rows.push(cur);
  let cum=0;
  rows.forEach(row=>{
    const e0=row.i0===0?eq0:c[row.i0-1].eq, e1=c[row.i1].eq;
    const d=e1-e0; cum=c[row.i1].eq-eq0;
    const ix0=P.ix[a+row.i0], ix1=P.ix[a+row.i1];
    const tr=document.createElement('tr');
    tr.innerHTML=`<th>${row.m.slice(0,4)}-${row.m.slice(4)}</th>
      <td class="n">${ix1.toFixed(0)}</td>
      <td class="n ${ix1>=ix0?'up':'dn'}">${((ix1/ix0-1)*100).toFixed(1)}%</td>
      <td class="n">${money(e0)}</td>
      <td class="n">${money(e1)}</td>
      <td class="n ${d>=0?'up':'dn'}">${money(d)}</td>
      <td class="n ${d>=0?'up':'dn'}">${e0?((e1/e0-1)*100).toFixed(1):'—'}%</td>
      <td class="n ${cum>=0?'up':'dn'}">${money(cum)}</td>`;
    mb.appendChild(tr);
  });

  // 逐筆調整
  const ab=$('adjs'); ab.innerHTML='';
  r.adjs.forEach(x=>{
    const tr=document.createElement('tr');
    if(x.why.indexOf('跌破')===0) tr.className='hl';
    tr.innerHTML=`<th>${dstr(x.d)}</th><td>${x.why}</td>
      <td class="n">${x.ix.toFixed(0)}</td><td class="n">${x.from||'—'}</td><td class="n">${x.to}</td>
      <td class="n">${x.c?money(x.c):'—'}</td><td class="n">${money(x.eq)}</td>
      <td class="n ${x.eq-eq0>=0?'up':'dn'}">${money(x.eq-eq0)}</td>`;
    ab.appendChild(tr);
  });

  const born={10:2022,50:2001,200:1998}[pv];
  const y0=+String(P.d[a]).slice(0,4);
  const bits=[];
  if(r.dead) bits.push('這組設定在 '+dstr(r.dead)+' 權益跌破維持保證金被強制平倉，後面的數字沒有意義。');
  if(y0<born) bits.push('<strong>'+CT[pv].n+' '+born+' 年才上市</strong>，'+y0+'～'+born+' 這段是拿它的規格模擬當年不存在的契約。');
  bits.push('保證金用今天的比率（原始 '+(IM_R*100).toFixed(2)+'%、維持 '+(MM_R*100).toFixed(2)+'%）。2000 與 2008 當年成數比現在高，真在那時候操作被追繳與平倉的機會更大。');
  bits.push('<strong>本金全部假設在期貨保證金帳戶裡。</strong>期交所的權益數只認期貨帳戶的錢，放銀行的不算。');
  bits.push('未計入：盤中追繳（只在日收盤檢查）、夜盤、轉倉手續費、大單市場衝擊。滑價以買賣價差 2 點計。');
  $('caveat').innerHTML='<b>這組數字的適用範圍</b>'+bits.join('　');

  $('foot').textContent='資料：加權指數日收盤與台指期近月合約真實開收盤，向後調整為連續序列（含實際轉倉損益），'
    +'與 output/txf_continuous.json 逐日對帳 0 天不符。'
    +'規則：收盤穿越均線→次一交易日開盤調整；轉倉日（結算日前 3 個交易日）校回目標槓桿。'
    +'本頁只做計算，不構成投資建議，也不會下任何單。';
}

['d0','d1','eq','ct','hi','lo','ma','rb'].forEach(id=>{
  $(id).addEventListener('input',render); $(id).addEventListener('change',render);
});
$('d0').min=$('d1').min=dstr(P.d[0]);
$('d0').max=$('d1').max=dstr(P.d[N-1]);
$('d0').value='2020-01-02';
$('d1').value=dstr(P.d[N-1]);
render();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
