AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABff2cfL9wUUAQX5MyZx162d1QFABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABpdT6HOffLazAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABbGfFevwtBQ3rxXv8OlQQAAAAAAAAAAAAAAAAGvsv+o478L3QUZ69agEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/9k=) center/cover no-repeat fixed,#0b0509;color:#f5eee6}
/* 雨夜窗外散景:多層光斑營造縱深 */
.bokeh{position:fixed;inset:-10%;z-index:0;pointer-events:none;filter:blur(2px);background:
 radial-gradient(14rem 14rem at 82% 18%,rgba(255,155,70,.16),transparent 70%),
 radial-gradient(9rem 9rem at 12% 26%,rgba(255,96,120,.13),transparent 70%),
 radial-gradient(11rem 11rem at 70% 78%,rgba(120,110,255,.10),transparent 70%),
 radial-gradient(6rem 6rem at 28% 72%,rgba(90,180,255,.09),transparent 70%),
 radial-gradient(4.5rem 4.5rem at 55% 12%,rgba(255,210,140,.12),transparent 70%),
 radial-gradient(3.2rem 3.2rem at 40% 42%,rgba(255,140,90,.10),transparent 70%)}
.orb{position:fixed;border-radius:50%;filter:blur(34px);z-index:0;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.o1{width:24rem;height:24rem;left:-8rem;bottom:-9rem;background:rgba(255,120,60,.13)}
.o2{width:17rem;height:17rem;right:-5rem;top:-6rem;background:rgba(190,80,140,.12);animation-delay:-8s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(2.2rem,-1.6rem,0)}}
canvas#rain{position:fixed;inset:0;z-index:1;pointer-events:none}
.gate{position:relative;z-index:2;text-align:center;width:min(23.5rem,92vw);
padding:3.2rem 2.4rem 2.8rem;border-radius:1.8rem;
background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.028) 55%,rgba(255,255,255,.05));
border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(1.25);
box-shadow:0 34px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.brand{font-size:2.5rem;font-weight:300;letter-spacing:.42em;text-indent:.42em;color:#fdf6ec;
text-shadow:0 2px 24px rgba(255,170,90,.25)}
.sub{margin-top:.9rem;color:rgba(245,238,230,.5);letter-spacing:.3em;text-indent:.3em;font-size:.62rem;font-weight:500}
.hint{color:rgba(245,238,230,.42);font-size:.78rem;margin-top:2.6rem;letter-spacing:.24em;text-indent:.24em}
/* 果凍輸入框:半透明+頂部高光+內底暈+聚焦光圈 */
input{margin-top:1rem;width:12.5rem;font-size:1.85rem;letter-spacing:.55em;text-align:center;text-indent:.55em;
color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);border-radius:999px;
padding:.72rem .4rem;outline:none;font-family:ui-monospace,Consolas,monospace;
backdrop-filter:blur(8px);transition:all .25s ease;
box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -10px 18px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}
input:focus{background:rgba(255,255,255,.15);border-color:rgba(255,205,150,.75);transform:scale(1.03);
box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 0 0 5px rgba(255,170,90,.14),0 14px 38px rgba(0,0,0,.4)}
input::placeholder{color:rgba(255,255,255,.3)}
.msg{height:1.4rem;margin-top:1rem;font-size:.8rem;color:#ff7d86;letter-spacing:.1em}
.ok{color:#ffc27a}
.shake{animation:sh .4s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.orb{animation:none}}
</style></head><body>
<div class="bokeh"></div><div class="orb o1"></div><div class="orb o2"></div>
<canvas id="rain"></canvas>
<div class="gate"><div class="brand">悉尼資本</div><div class="sub">SYDNEY CAPITAL RESEARCH DESK</div>
<div class="hint">輸入四位數通行碼</div>
<input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" autofocus>
<div class="msg" id="msg"></div></div>
<script>
(function(){
 /* 門頁天氣=行情:漲→煙花,跌→雨。方向讀公開的 mood.json(只含漲跌方向,公開資訊) */
 const cv=document.getElementById("rain"),ctx=cv.getContext("2d");
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
 let W,H,drops,rips,rockets,parts,mode="rain";
 const FXC=["241,189,87","255,92,99","255,196,140","250,240,220"];
 function reset(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  drops=Array.from({length:Math.min(150,Math.floor(W/10))},()=>({x:Math.random()*W,y:Math.random()*H,
   l:9+Math.random()*17,v:6.5+Math.random()*9,w:.4+Math.random()*.9,o:.16+Math.random()*.24}));rips=[];rockets=[];parts=[]}
 reset();addEventListener("resize",reset);
 function setMood(dir){const nm=dir==="up"?"fx":"rain";if(nm!==mode){mode=nm;rockets=[];parts=[];
  if(nm==="fx")rockets.push({x:W*.3,y:H*.7,vy:-7,ty:H*.3,c:FXC[0]},{x:W*.68,y:H*.9,vy:-6.5,ty:H*.38,c:FXC[1]})}}
 if(location.search.indexOf("fx=1")>=0)setMood("up");
 else fetch("mood.json",{cache:"no-store"}).then(r=>r.json()).then(m=>{if(m&&m.dir==="up")setMood("up")}).catch(()=>{});
 function rainFrame(){
  drops.forEach(d=>{
   ctx.strokeStyle="rgba(220,228,246,"+d.o+")";
   ctx.lineWidth=d.w;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*.16,d.y+d.l);ctx.stroke();
   d.x-=d.v*.16;d.y+=d.v;
   if(d.y>H-8){if(Math.random()<.28)rips.push({x:d.x,y:H-6,r:1,a:.42});d.y=-22;d.x=Math.random()*W}
  });
  rips.forEach(r=>{ctx.strokeStyle="rgba(220,228,246,"+r.a+")";ctx.lineWidth=.8;
   ctx.beginPath();ctx.ellipse(r.x,r.y,r.r*2.2,r.r*.7,0,0,7);ctx.stroke();r.r+=.7;r.a-=.02});
  for(let i=rips.length-1;i>=0;i--)if(rips[i].a<=0)rips.splice(i,1);
 }
 function fxFrame(){
  if(rockets.length<3&&Math.random()<.032)
   rockets.push({x:W*(.1+Math.random()*.8),y:H+6,vy:-(5.5+Math.random()*3.2),ty:H*(.16+Math.random()*.38),c:FXC[Math.floor(Math.random()*FXC.length)]});
  for(let i=rockets.length-1;i>=0;i--){const k=rockets[i];
   ctx.strokeStyle="rgba("+k.c+",.85)";ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(k.x,k.y);ctx.lineTo(k.x,k.y+11);ctx.stroke();
   k.y+=k.vy;
   if(k.y<=k.ty){const n=55+Math.floor(Math.random()*32);
    for(let j=0;j<n;j++){const a=Math.PI*2*j/n+Math.random()*.25,s=1.2+Math.random()*3.6;
     parts.push({x:k.x,y:k.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.72?k.c:FXC[Math.floor(Math.random()*FXC.length)]})}
    rockets.splice(i,1)}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
   ctx.fillStyle="rgba("+p.c+","+(p.life*.28)+")";
   ctx.beginPath();ctx.arc(p.x,p.y,3.4,0,7);ctx.fill();
   ctx.fillStyle="rgba("+p.c+","+(p.life*.95)+")";
   ctx.beginPath();ctx.arc(p.x,p.y,1.7,0,7);ctx.fill();
   p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.985;p.life-=.009;
   if(p.life<=0)parts.splice(i,1)}
 }
 function frame(){
  if(mode==="fx"){
   ctx.globalCompositeOperation="destination-out";
   ctx.fillStyle="rgba(0,0,0,.16)";ctx.fillRect(0,0,W,H);
   ctx.globalCompositeOperation="source-over";
   fxFrame()
  }else{ctx.clearRect(0,0,W,H);rainFrame()}
  if(!reduced&&!window.__unlocked)requestAnimationFrame(frame)
 }
 frame()
})();
</script>
<script>
const $=id=>document.getElementById(id);
let encP=null;
function loadEnc(){/* 頁面一開就背景預載加密包,打完通行碼時多半已在本地 */
  if(!encP)encP=fetch("desk.enc",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(a=>new Uint8Array(a)).catch(e=>{encP=null;throw e});
  return encP;
}
loadEnc();
async function tryPin(pin,silent){
  try{
    $("msg").textContent="解鎖中…";$("msg").className="msg ok";
    const b=await loadEnc();
    const salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
    const ds=new DecompressionStream("gzip");
    const html=await new Response(new Response(pt).body.pipeThrough(ds)).text();
    /* 整頁替換而非iframe:錨點路由才是同文件導航,選單不會把門頁重載進框架 */
    window.__unlocked=1;
    window.__pin=pin;try{window.name="sc:"+pin}catch(e){}/* 供站內解密盤中現價live.enc;window.name跨文件替換仍存活 */
    document.open();document.write(html);document.close();
  }catch(e){
    if(!silent){$("msg").textContent="通行碼不對";$("msg").className="msg";
      const i=$("pin");i.value="";i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");i.focus();}
    else{$("msg").textContent="";}
  }
}
$("pin").addEventListener("input",e=>{const v=e.target.value.replace(/\D/g,"");e.target.value=v;if(v.length===4)tryPin(v,false);});
localStorage.removeItem("sc_pin");
</script></body></html>
